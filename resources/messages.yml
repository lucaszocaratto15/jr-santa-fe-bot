appCannotBeClosed:
  en: "O JR Bot não conseguiu fechar ou remover a versão anterior.\n\nFeche o JR Bot e qualquer programa que possa estar usando arquivos da pasta de instalação e clique em Repetir.\n\nSe Repetir voltar para esta tela, clique em Cancelar. O instalador mostra o caminho, o programa indicado pelo Windows e o registro da instalação."
  pt_BR: "O JR Bot não conseguiu fechar ou remover a versão anterior.\n\nFeche o JR Bot e qualquer programa que possa estar usando arquivos da pasta de instalação e clique em Repetir.\n\nSe Repetir voltar para esta tela, clique em Cancelar. O instalador mostra o caminho, o programa indicado pelo Windows e o registro da instalação."
