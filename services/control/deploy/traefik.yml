services:
  control:
    container_name: jr-bot-control
    networks:
      - traefik-proxy
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-proxy
      traefik.http.routers.jr-bot-control.rule: 'Host(`jrsantafe.stratacerta.com.br`) && (PathPrefix(`/bot/`) || Path(`/bot`))'
      traefik.http.routers.jr-bot-control.entrypoints: websecure
      traefik.http.routers.jr-bot-control.tls.certresolver: letsencrypt
      traefik.http.routers.jr-bot-control.priority: '250'
      traefik.http.routers.jr-bot-control.middlewares: jr-bot-control-prefix
      traefik.http.middlewares.jr-bot-control-prefix.stripprefix.prefixes: /bot
      traefik.http.services.jr-bot-control.loadbalancer.server.port: '8787'
  updates:
    image: nginx:1.27-alpine
    container_name: jr-bot-updates
    restart: unless-stopped
    networks:
      - traefik-proxy
    volumes:
      - /opt/mmx-gw/data/updates:/usr/share/nginx/html:ro
    labels:
      traefik.enable: 'true'
      traefik.docker.network: traefik-proxy
      traefik.http.routers.jr-bot-updates.rule: 'Host(`jrsantafe.stratacerta.com.br`) && PathPrefix(`/mmx/updates`)'
      traefik.http.routers.jr-bot-updates.entrypoints: websecure
      traefik.http.routers.jr-bot-updates.tls.certresolver: letsencrypt
      traefik.http.routers.jr-bot-updates.priority: '260'
      traefik.http.routers.jr-bot-updates.middlewares: jr-bot-updates-prefix
      traefik.http.middlewares.jr-bot-updates-prefix.stripprefix.prefixes: /mmx/updates
      traefik.http.services.jr-bot-updates.loadbalancer.server.port: '80'
networks:
  traefik-proxy:
    external: true
